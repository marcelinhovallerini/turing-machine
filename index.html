<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turing Machine</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at top,#1a2750 0%,#090c18 45%,#05070d 100%);
    color:white;
    font-family:'Inter',sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:18px;
}

.app{
    width:100%;
    max-width:1250px;
    height:95vh;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.panel{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:28px;
    backdrop-filter:blur(12px);
    box-shadow:
        0 10px 40px rgba(0,0,0,0.45);

    overflow:hidden;
}

.left{
    display:flex;
    flex-direction:column;
    padding:24px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.logo{
    font-family:'Orbitron',sans-serif;
    font-size:34px;
    letter-spacing:2px;
    font-weight:700;
}

.btn{
    border:none;
    border-radius:16px;
    padding:14px 20px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.blue{
    background:#2563eb;
    color:white;
}

.green{
    background:#10b981;
    color:white;
}

.yellow{
    background:#facc15;
    color:black;
}

.inputs{
    display:flex;
    justify-content:center;
    gap:12px;

    margin-bottom:22px;
}

.digit{
    width:82px;
    height:82px;

    border:none;
    border-radius:20px;
    background:#0f172a;

    color:white;

    font-size:38px;
    text-align:center;
    font-weight:700;

    outline:none;

    border:2px solid transparent;

    transition:0.2s;
}

.digit:focus{
    border-color:#3b82f6;
    transform:scale(1.03);
}

@media(max-width:950px){

    .digit{
        width:68px;
        height:68px;
        font-size:32px;
    }

}

.verifiers{
    flex:1;
    overflow:auto;
    padding-right:5px;
}

.verifiers::-webkit-scrollbar{
    width:8px;
}

.verifiers::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}

.verifier{
    background:#0f172a;
    border-radius:24px;
    padding:18px;
    margin-bottom:14px;

    border:1px solid rgba(255,255,255,0.05);
}

.verifier-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.verifier-name{
    font-size:20px;
    font-weight:700;
    line-height:1.3;
}

.result{
    margin-top:14px;
    padding:12px;
    border-radius:14px;
    text-align:center;
    font-weight:700;
    font-size:17px;
}

.true{
    background:rgba(16,185,129,0.2);
    color:#6ee7b7;
}

.false{
    background:rgba(239,68,68,0.2);
    color:#fca5a5;
}

.right{
    padding:24px;

    display:flex;
    flex-direction:column;

    gap:18px;

    min-height:0;
}

.side-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:18px;
}

.guess-area{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.message{
    margin-top:18px;
    text-align:center;
    font-size:24px;
    font-weight:700;
    min-height:40px;
}

.symbol-row{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:10px;
}

.symbol-row div{

    width:82px;
    text-align:center;

    font-size:28px;
    font-weight:700;

    color:#93c5fd;
}

.notes-panel{

    margin-top:10px;

    background:rgba(255,255,255,0.03);

    border:1px solid rgba(255,255,255,0.05);

    border-radius:24px;

    padding:18px;
}

.notes-title{

    font-size:22px;
    font-weight:700;

    margin-bottom:16px;
}

.shape-notes{

    display:flex;

    gap:12px;

    margin-bottom:14px;
}

.shape-box{

    flex:1;

    min-width:0;

    background:#0f172a;

    border-radius:18px;

    padding:10px;

    display:flex;
    flex-direction:column;

    gap:6px;
}

.shape-label{

    font-size:24px;
    font-weight:700;

    text-align:center;
}

.triangle .shape-label{
    color:#60a5fa;
}

.circle .shape-label{
    color:#facc15;
}

.square .shape-label{
    color:#f87171;
}

.shape-box textarea,
.general-notes{

    resize:none;

    border:none;
    outline:none;

    background:#020617;

    color:white;

    border-radius:14px;

    padding:8px;

    font-family:'Inter',sans-serif;

    font-size:14px;
}

.shape-box textarea{

    width:100%;

    height:120px;
}

.general-notes{

    width:100%;

    height:110px;
}

.shape-box textarea::-webkit-scrollbar,
.general-notes::-webkit-scrollbar{

    width:6px;
}

.shape-box textarea::-webkit-scrollbar-thumb,
.general-notes::-webkit-scrollbar-thumb{

    background:#334155;
    border-radius:20px;
}


@media(max-width:950px){

    body{

        overflow:auto;
        height:auto;

        padding:10px;
    }

    .app{

        height:auto;

        grid-template-columns:1fr;

        gap:14px;
    }

    .panel{

        border-radius:22px;
    }

    .left,
    .right{

        padding:16px;
    }

    .logo{

        font-size:24px;
    }

    .topbar{

        gap:10px;
    }

    .btn{

        padding:12px 14px;

        font-size:14px;
    }

    .symbol-row{

        gap:8px;
    }

    .symbol-row div{

        width:72px;

        font-size:24px;
    }

    .inputs{

        gap:8px;
    }

    .digit{

        width:72px;
        height:72px;

        font-size:34px;

        border-radius:18px;
    }

    .verifier{

        padding:14px;

        border-radius:18px;
    }

    .verifier-top{

        align-items:flex-start;

        flex-direction:column;

        gap:12px;
    }

    .verifier-name{

        font-size:18px;
    }

    .shape-notes{

        flex-direction:column;
    }

    .shape-box textarea{

        height:90px;
    }

    .general-notes{

        height:100px;
    }

    .guess-area{

        margin-top:18px;
    }

}

</style>
</head>
<body>

<div class="app">

    <div class="panel left">

        <div class="topbar">

            <div class="logo">
                TURING MACHINE
            </div>

            <button class="btn blue" onclick="newGame()">
                Novo jogo
            </button>

        </div>

	<div class="symbol-row">
    	    <div>▲</div>
    	    <div>●</div>
    	    <div>■</div>
	</div>

        <div class="inputs">
            <input maxlength="1" class="digit test-digit">
            <input maxlength="1" class="digit test-digit">
            <input maxlength="1" class="digit test-digit">
        </div>

        <div class="verifiers" id="verifiers"></div>

    </div>

    <div class="panel right">

    <div class="notes-panel">

    <div class="shape-notes">

        <div class="shape-box triangle">

            <div class="shape-label">
                ▲
            </div>

            <textarea placeholder="Anotações do ▲"></textarea>

        </div>

        <div class="shape-box circle">

            <div class="shape-label">

            </div>

            <textarea placeholder="Anotações do ●"></textarea>

        </div>

        <div class="shape-box square">

            <div class="shape-label">

            </div>

            <textarea placeholder="Anotações do ■"></textarea>

        </div>

    </div>

    <textarea
    class="general-notes"
    placeholder="Anotações gerais..."></textarea>

</div>

        <div class="guess-area">

	<div class="symbol-row">
    	    <div>▲</div>
    	    <div>●</div>
    	    <div>■</div>
	</div>

            <div class="inputs">
                <input maxlength="1" class="digit guess-digit">
                <input maxlength="1" class="digit guess-digit">
                <input maxlength="1" class="digit guess-digit">
            </div>

            <button class="btn yellow" style="width:100%" onclick="submitGuess()">
                Confirmar
            </button>

	    <button class="btn"
    		style="
        	background:#ef4444;
        	color:white;
        	margin-left:10px;
    		"
    		onclick="revealAnswer()">
    		Revelar resposta
		</button>

            <div class="message" id="message"></div>

        </div>

    </div>

</div>

<script>

const ALL_CODES = []

for(let a=1;a<=9;a++){

    for(let b=0;b<=9;b++){

        for(let c=0;c<=9;c++){

            ALL_CODES.push([a,b,c])

        }

    }

}

const VERIFIERS = [

/* =========================
   CLASSE A
========================= */

{
    id:"first_vs_5",
    class:"A",
    name:"▲ comparado ao 5",

    evaluate:(arr)=>{

        if(arr[0] < 5) return "menor"
        if(arr[0] > 5) return "maior"

        return "igual"

    },

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"second_vs_5",

    },

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"third_vs_5",
    class:"A",
    name:"■ comparado ao 5",

    evaluate:(arr)=>{

        if(arr[2] < 5) return "menor"
        if(arr[2] > 5) return "maior"

        return "igual"

    },

    check(test,secret){

            this.evaluate(test) ===

        )

    }
},

{
    id:"first_even_odd",
    class:"A",
    name:"▲ é par",

    evaluate:(arr)=>
        arr[0] % 2 === 0 ? "par" : "ímpar",

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"second_even_odd",
    class:"A",
    name:"● é par",

    evaluate:(arr)=>
        arr[1] % 2 === 0 ? "par" : "ímpar",

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"third_even_odd",
    class:"A",
    name:"■ é par",

    evaluate:(arr)=>
        arr[2] % 2 === 0 ? "par" : "ímpar",

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"multiple_3_count",
    class:"A",
    name:"Quantidade de múltiplos de 3",

    evaluate:(arr)=>
        arr.filter(n=>n%3===0).length,

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

/* CONTAGEM DE 1 A 9 */

...[1,2,3,4,5,6,7,8,9].map(num=>({

    id:`count_${num}`,
    class:"A",
    name:`Quantidade de números ${num}`,

    evaluate:(arr)=>
        arr.filter(n=>n===num).length,

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }

})),

{
    id:"equal_numbers_count",
    class:"A",
    name:"Quantidade de números iguais",

    evaluate:(arr)=>{

        if(
            arr[0]===arr[1] &&
            arr[1]===arr[2]
        ) return 3

        if(
            arr[0]===arr[1] ||
            arr[1]===arr[2] ||
            arr[0]===arr[2]
        ) return 2

        return 0

    },

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

/* =========================
   CLASSE B
========================= */

{
    id:"first_is_smallest",
    class:"B",
    name:"▲ é o menor",

    evaluate:(arr)=>
        arr[0] < arr[1] &&
        arr[0] < arr[2],

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"second_is_smallest",
    class:"B",
    name:"● é o menor",

    evaluate:(arr)=>
        arr[1] < arr[0] &&
        arr[1] < arr[2],

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"third_is_smallest",
    class:"B",
    name:"■ é o menor",

    evaluate:(arr)=>
        arr[2] < arr[0] &&
        arr[2] < arr[1],

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"even_count",
    class:"B",
    name:"Quantidade de pares",

    evaluate:(arr)=>
        arr.filter(n=>n%2===0).length,

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"odd_count",
    class:"B",
    name:"Quantidade de ímpares",

    evaluate:(arr)=>
        arr.filter(n=>n%2!==0).length,

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"prime_count",
    class:"B",
    name:"Quantidade de primos",

    evaluate:(arr)=>
        arr.filter(n=>
            [2,3,5,7].includes(n)

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"sum_even_odd",
    class:"B",
    name:"Soma de todos é par ou ímpar",

    evaluate:(arr)=>
        (
            arr[0]+arr[1]+arr[2]

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"first_two_vs_10",

    evaluate:(arr)=>{

        if(s < 10) return "menor"

    },

    check(test,secret){

        )

    }
},

{
    id:"last_two_vs_10",
    class:"B",
    name:"● + ■ comparada a 10",

    evaluate:(arr)=>{

        const s = arr[1]+arr[2]

        if(s < 10) return "menor"
        if(s > 10) return "maior"

    },

    check(test,secret){

            this.evaluate(secret)
        )

    }
},

{
    id:"sum_vs_15",

{

        return "igual"

    },

    check(test,secret){

        )

},

========================= */

{
    id:"ascending",

    evaluate:(arr)=>
        arr[0] < arr[1] &&
        arr[1] < arr[2],

    check(test,secret){

        return (
            this.evaluate(test) ===
            this.evaluate(secret)
        )

    }
},

{
    id:"descending",

    name:"É decrescente",

    evaluate:(arr)=>

    check(test,secret){

        return (

{
    id:"first_two_consecutive",

    evaluate:(arr)=>

    check(test,secret){

        )

    }
},

{
    id:"last_two_consecutive",
    class:"C",
    name:"Dois últimos consecutivos",

    evaluate:(arr)=>

    check(test,secret){

        return (
            this.evaluate(test) ===

        )

    }
},

{
    id:"first_two_vs_third",
    class:"C",
    name:"▲ + ●  comparada com ■",

    evaluate:(arr)=>{

{

{

{

        }

    },

        ) % 2 === 0,

        )

let secretCode = []
let selectedVerifiers = []

let lockedCode = null
let testsUsed = 0

function randomItem(arr){

    return arr[
        Math.floor(Math.random()*arr.length)
    ]
}

function revealAnswer(){

    alert(
        "Código secreto: " +
        secretCode.join("")
    )

}

function shuffle(arr){

    return [...arr]
        .sort(()=>Math.random()-0.5)
}

function equal(a,b){

    return (
        a[0]===b[0] &&
        a[1]===b[1] &&
        a[2]===b[2]
    )
}

function pickVerifiers(){

    const classA =
        shuffle(
            VERIFIERS.filter(v=>v.class==="A")
        ).slice(0,2)

    const classB =
        shuffle(
            VERIFIERS.filter(v=>v.class==="B")
        ).slice(0,1)

    const classC =
        shuffle(
            VERIFIERS.filter(v=>v.class==="C")
        ).slice(0,1)

    const classD =
        shuffle(
            VERIFIERS.filter(v=>v.class==="D")
        ).slice(0,1)

    const classE =
        shuffle(
            VERIFIERS.filter(v=>v.class==="E")
        ).slice(0,1)

    return [

        ...classA,
        ...classB,
        ...classC,
        ...classD,
        ...classE

    ]

}

function generatePuzzle(){

    const chosen =
        pickVerifiers()

    while(true){

        const secret =
            randomItem(ALL_CODES)

        const secretPattern =
            chosen.map(v=>
                v.evaluate(secret)
            )

        const solutions =
            ALL_CODES.filter(candidate=>{

                const candidatePattern =
                    chosen.map(v=>
                        v.evaluate(candidate)
                    )

                return candidatePattern.every(
                    (p,i)=>p===secretPattern[i]
                )

            })

        if(solutions.length === 1){

            return {

                secret,
                verifiers:chosen

            }

        }

    }

}

function renderVerifiers(){

    const container =
        document.getElementById("verifiers")

    container.innerHTML = ""

    selectedVerifiers.forEach((v,index)=>{

        container.innerHTML += `
        
        <div class="verifier">

            <div class="verifier-top">

                <div class="verifier-name">
                    ${v.name}
                </div>

                <button
                    class="btn green"
                    id="btn-${index}"
                    onclick="testVerifier(${index})">
                    Testar
                </button>

            </div>

            <div id="result-${index}"></div>

        </div>
        
        `
    })

}

function getTestCode(){

    return [
        ...document.querySelectorAll(".test-digit")
    ].map(i=>Number(i.value))

}

function getGuessCode(){

    return [
        ...document.querySelectorAll(".guess-digit")
    ].map(i=>Number(i.value))

}

function valid(code){

    return code.every(
        n=>!isNaN(n)
    )

}

function lockInputs(){

    document
        .querySelectorAll(".test-digit")
        .forEach(i=>i.disabled=true)

}

function unlockInputs(){

    document
        .querySelectorAll(".test-digit")
        .forEach(i=>i.disabled=false)

}

function resetRound(){

    lockedCode = null
    testsUsed = 0

    unlockInputs()

    document
        .querySelectorAll(".test-digit")
        .forEach(i=>i.value="")

    selectedVerifiers.forEach((v,index)=>{

        document
            .getElementById(`result-${index}`)
            .innerHTML=""

        const btn =
            document.getElementById(`btn-${index}`)

        btn.disabled=false
        btn.style.opacity=1

    })

}

function testVerifier(index){

    if(testsUsed >= 3) return

    const code =
        getTestCode()

    if(!valid(code)) return

    if(!lockedCode){

        lockedCode=[...code]
        lockInputs()

    }

    const result =
        selectedVerifiers[index]
	.check(lockedCode, secretCode)

    document
        .getElementById(`result-${index}`)
        .innerHTML = `
        
        <div class="result ${result ? 'true':'false'}">
            ${result ? 'VERDADEIRO':'FALSO'}
        </div>
        
        `

    const btn =
        document.getElementById(`btn-${index}`)

    btn.disabled=true
    btn.style.opacity=0.4

    testsUsed++

    if(testsUsed >= 3){

        setTimeout(()=>{

            alert(
                "3 testes utilizados"
            )

            resetRound()

        },300)

    }

}

function submitGuess(){

    const guess =
        getGuessCode()

    if(!valid(guess)) return

    const message =
        document.getElementById("message")

    if(equal(guess,secretCode)){

        message.innerHTML =
            "🎉 CORRETO"

    }else{

        message.innerHTML =
            "❌ INCORRETO"

    }

}

function newGame(){

    const puzzle =
        generatePuzzle()

    secretCode =
        puzzle.secret

    selectedVerifiers =
        puzzle.verifiers

    renderVerifiers()

    resetRound()

    document
        .querySelectorAll(".guess-digit")
        .forEach(i=>i.value="")

    document
        .getElementById("message")
        .innerHTML=""

    console.log(
        "Código:",
        secretCode.join("")
    )

}

newGame()

</script>
